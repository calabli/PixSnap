<h1>PixSnap 已安装好</h1>
<ol>
<li>在“应用程序”里打开 PixSnap，它会出现在屏幕顶部的菜单栏里。</li>
<li>按 <kbd>⌘⇧2</kbd> 截图。第一次截图时，macOS 会请你在“系统设置 › 隐私与安全性 › 屏幕与系统录音”里允许 PixSnap。</li>
<li>允许以后重新打开 PixSnap，就可以开始用了。</li>
</ol>
<p>把鼠标移到屏幕顶部的刘海往下拉，就能打开晾衣架，看到所有截图。</p>
</body></html>
