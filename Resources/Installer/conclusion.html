<style>body{font:13px -apple-system,"PingFang SC",sans-serif;color:#1d1d1f;line-height:1.6}h1{font-size:20px;margin:0 0 8px}li{margin:6px 0}kbd{font-family:inherit;font-weight:600}@media (prefers-color-scheme:dark){body{color:#f5f5f7}}</style>

<h1>PixSnap 已安装好</h1>
<ol>
<li>PixSnap 已经自动打开，在屏幕顶部的菜单栏里（没看到的话，从“应用程序”里打开它）。</li>
<li>按 <kbd>⌘⇧2</kbd> 截图。第一次截图时，macOS 会请你在“系统设置 › 隐私与安全性 › 屏幕与系统录音”里允许 PixSnap。</li>
<li>允许以后重新打开 PixSnap，就可以开始用了。</li>
</ol>
<p>把鼠标移到屏幕顶部的刘海往下拉，就能打开晾衣架，看到所有截图。</p>
<p>按 <kbd>⌥⇧5</kbd> 录屏，选“讲解”录一段操作教程，录完在精修里自动放大、剪辑和打码。</p>
</body></html>
