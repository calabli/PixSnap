<h1>欢迎安装 PixSnap</h1>
<p>PixSnap 是一款原生 macOS 截图工具。这个安装器会把 PixSnap 放进“应用程序”文件夹。</p>
<ul>
<li>六种截图方式：区域、全屏、窗口、延时、长截图和录屏</li>
<li>截完浮在原位置，直接标注、钉住、复制、拖到其他应用</li>
<li>截图历史挂在从刘海拉下来的晾衣架上</li>
<li>文字识别、智能美化、截图翻译，全部在本机完成</li>
</ul>
<p>需要 macOS 14 或更新版本，截图翻译需要 macOS 15。</p>
